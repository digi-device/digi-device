[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digi-device"
version = "0.1.0"
description = "Dual-pump (insulin + glucagon) simulation built on simglucose"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Legacy gym==0.9.4 (pulled in by simglucose) needs pkg_resources,
    # which newer setuptools removed
    "setuptools<81",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
portal = ["flask>=3.1,<4"]
kaggle = ["kagglehub[pandas-datasets]"]

# No top-level Python package yet; stops setuptools auto-discovery from
# picking up sim/ and results/
[tool.setuptools]
packages = ["users", "database", "personalization", "interface"]
py-modules = ["main", "config", "simulation_import", "carb_reporting", "run_sim"]

[tool.setuptools.package-data]
database = ["schema.sql"]
interface = ["templates/*.html", "static/*.css"]
